steps:
  - label: "🔧 Generate conditional pipeline"
    command: |
      echo "FORCE_BUILD is set to: ${FORCE_BUILD:-not set}"
      
      if [ "$FORCE_BUILD" = "1" ]; then
        echo "🚀 Force build mode - running all steps"
        cat <<EOF | buildkite-agent pipeline upload
      steps:
        - label: "📦 Build frontend"
          command: |
            echo "Building frontend..."
            ls -la frontend/ || echo "frontend/ directory not found"
            
        - label: "🔨 Build backend"
          command: |
            echo "Building backend..."
            ls -la backend/ || echo "backend/ directory not found"
      EOF
      else
        echo "🎯 Conditional build mode - using if_changed"
        cat <<EOF | buildkite-agent pipeline upload
      steps:
        - label: "📦 Build frontend"
          command: |
            echo "Building frontend (triggered by frontend changes)..."
            ls -la frontend/
          if_changed: "frontend/**"
          
        - label: "🔨 Build backend"
          command: |
            echo "Building backend (triggered by backend changes)..."
            ls -la backend/
          if_changed: "backend/**"
      EOF
      fi
