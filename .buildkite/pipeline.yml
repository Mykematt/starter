steps:
  - label: "🟢 Start Gate-1"
    command: 'echo "Opening gate-1 at $(date +%H:%M:%S)"'
    concurrency: 1
    concurrency_group: test-gate-1
    concurrency_method: eager
  
  - label: "📤 Upload rest of pipeline"
    command: |
      cat <<EOF | buildkite-agent pipeline upload
      steps:
        - label: "💤 Sleep 10s (inside gate)"
          command: 'echo "Sleeping at \$(date +%H:%M:%S)" && sleep 10'
          concurrency: 1
          concurrency_group: test-gate-1
          concurrency_method: eager
        
        - wait
        
        - label: "🔴 End Gate-1"
          command: 'echo "Closing gate-1 at \$(date +%H:%M:%S)"'
          concurrency: 1
          concurrency_group: test-gate-1
          concurrency_method: eager
        
        - label: "✅ After gate"
          command: 'echo "Completed at \$(date +%H:%M:%S)"'
      EOF
